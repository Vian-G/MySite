<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Yaskawa welding software architecture</title>
  <desc id="desc">MATLAB experiment interface connects through a C++ gateway to Yaskawa robot-job workflows and ESAB welding integration. Simulation and logging support offline validation. This is a conceptual software diagram.</desc>
  <defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#ddd8c9" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8422d" stroke-width="1.5"/></marker></defs>
  <path fill="#f1ede4" d="M0 0h800v500H0z"/><path fill="url(#grid)" d="M0 0h800v500H0z"/>
  <g font-family="Arial, sans-serif" fill="#2b2d2a">
    <text x="48" y="53" font-size="15" letter-spacing="3" fill="#b8422d">EMIT LAB / SOFTWARE ARCHITECTURE</text>
    <text x="48" y="100" font-size="35" font-weight="700">From job review to experiment.</text>
    <g fill="#e8e6d9" stroke="#8d8a82" stroke-width="1.5"><rect x="48" y="154" width="210" height="120" rx="4"/><rect x="300" y="154" width="200" height="120" rx="4"/><rect x="542" y="154" width="210" height="120" rx="4"/><rect x="48" y="332" width="704" height="104" rx="4"/></g>
    <g stroke="#b8422d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M258 214h40"/><path d="M500 214h40"/><path d="M400 332v-56"/></g>
    <g font-size="22" font-weight="700"><text x="68" y="195">MATLAB UI</text><text x="320" y="195">C++ gateway</text><text x="562" y="195">Yaskawa / ESAB</text><text x="68" y="372">Simulation + session logging</text></g>
    <g font-size="17" fill="#5b594f"><text x="68" y="226">Review jobs</text><text x="68" y="251">Prepare experiments</text><text x="320" y="226">YMConnect API</text><text x="320" y="251">Controller interface</text><text x="562" y="226">Robot-job workflows</text><text x="562" y="251">Welding integration</text><text x="68" y="405">Offline tests · explicit live actions · recorded experiment history</text></g>
    <text x="48" y="473" font-size="13" letter-spacing="1.5" fill="#5b594f">CONCEPTUAL SOFTWARE FLOW / LIVE ACCEPTANCE PENDING</text>
  </g>
</svg>
